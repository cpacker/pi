name: Export pi-ai package branch

on:
  push:
    branches:
      - main
      - feat/freeform-tools
    paths:
      - .github/workflows/export-pi-ai.yml
      - package-lock.json
      - package.json
      - packages/ai/**
      - scripts/export-pi-ai-package-branch.mjs
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to update with the packaged pi-ai artifact
        required: false
        default: pi-ai
        type: string

permissions:
  contents: write

concurrency:
  group: export-pi-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Export pi-ai package branch
        env:
          PI_AI_EXPORT_BRANCH: ${{ github.event.inputs.target_branch || 'pi-ai' }}
          PI_AI_EXPORT_REMOTE: origin
          PI_AI_EXPORT_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: npm run export:pi-ai
